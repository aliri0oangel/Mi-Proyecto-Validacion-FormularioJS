<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Registro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./estilos-puntuales.css" />
  </head>
  <body class="bg-[#e8f0fe] min-h-screen flex items-center justify-center p-4">
    <form
      action=""
      id="formulario"
      class="bg-[#fffdf7] rounded-2xl shadow-lg p-4 sm:p-8 w-full max-w-2xl"
    >
      <!-- Titulo -->
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-[#3d4f6f]">
          Formulario de Registro
        </h1>
        <p class="text-[#8e9bb5] mt-1">
          Completa todos los campos para registrarte e ingresar a nuestra academia
        </p>
      </div>

      <!-- Seccion: Datos Personales -->
      <div class="mb-6">
        <h2 class="text-sm font-semibold text-[#7ba7d7] uppercase tracking-wide mb-4">
          Datos Personales
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Nombre -->
          <div>
            <label for="nombre" class="block text-sm font-medium text-[#3d4f6f] mb-1">Nombre</label>
            <input
              type="text"
              placeholder="Nombre"
              id="nombre"
              name="nombre"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_nombre" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>

          <!-- Apellido -->
          <div>
            <label for="apellido" class="block text-sm font-medium text-[#3d4f6f] mb-1">Apellido</label>
            <input
              type="text"
              placeholder="Apellido"
              id="apellido"
              name="apellido"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_apellido" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>
        </div>

        <!-- Cedula -->
        <div class="mt-4">
          <label for="cedula" class="block text-sm font-medium text-[#3d4f6f] mb-1">Cedula de identidad</label>
          <input
            type="text"
            placeholder="V2804716 o E32648512"
            id="cedula"
            name="cedula"
            class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
          />
          <div id="mensaje_cedula" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
        </div>

        <!-- Fecha de nacimiento -->
        <div class="mt-4">
          <label for="nacimiento" class="block text-sm font-medium text-[#3d4f6f] mb-1">Fecha de nacimiento</label>
          <input
            type="date"
            id="nacimiento"
            name="nacimiento"
            class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
          />
          <div id="mensaje_nacimiento" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
        </div>
      </div>

      <!-- Seccion: Contacto -->
      <div class="mb-6">
        <h2 class="text-sm font-semibold text-[#7ba7d7] uppercase tracking-wide mb-4">
          Contacto
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Correo -->
          <div>
            <label for="correo" class="block text-sm font-medium text-[#3d4f6f] mb-1">Correo</label>
            <input
              type="email"
              placeholder="correo@ejemplo.com"
              id="correo"
              name="correo"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_correo" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>

          <!-- Telefono -->
          <div>
            <label for="telefono" class="block text-sm font-medium text-[#3d4f6f] mb-1">Telefono</label>
            <input
              type="text"
              placeholder="+584141234567"
              id="telefono"
              name="telefono"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_telefono" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>
        </div>
      </div>

      <!-- Seccion: Ubicacion -->
      <div class="mb-6">
        <h2 class="text-sm font-semibold text-[#7ba7d7] uppercase tracking-wide mb-4">
          Ubicacion
        </h2>

        <!-- Direccion -->
        <div class="mb-4">
          <label for="direccion" class="block text-sm font-medium text-[#3d4f6f] mb-1">Direccion de habitacion</label>
          <input
            type="text"
            placeholder="Direccion"
            id="direccion"
            name="direccion"
            class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
          />
          <div id="mensaje_direccion" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Ciudad -->
          <div>
            <label for="ciudad" class="block text-sm font-medium text-[#3d4f6f] mb-1">Ciudad</label>
            <input
              type="text"
              placeholder="Ciudad"
              id="ciudad"
              name="ciudad"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_ciudad" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>

          <!-- Pais -->
          <div>
            <label for="pais" class="block text-sm font-medium text-[#3d4f6f] mb-1">Pais</label>
            <select
              name="pais"
              id="pais"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            >
              <option value="">Seleccione un pais</option>
              <option value="venezuela">Venezuela</option>
              <option value="colombia">Colombia</option>
              <option value="peru">Peru</option>
              <option value="chile">Chile</option>
            </select>
            <div id="mensaje_pais" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>
        </div>
      </div>

      <!-- Seccion: Preferencias -->
      <div class="mb-6">
        <h2 class="text-sm font-semibold text-[#7ba7d7] uppercase tracking-wide mb-4">
          Preferencias
        </h2>

        <!-- Genero -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-[#3d4f6f] mb-2">Genero</label>
          <div class="flex flex-wrap gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="genero"
                value="masculino"
                id="masculino"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Masculino</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="genero"
                value="femenino"
                id="femenino"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Femenino</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="genero"
                value="otro"
                id="otro"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Otro</span>
            </label>
          </div>
          <div id="mensaje_genero" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
        </div>

        <!-- Modalidad -->
        <div class="mb-4">
          <label class="block text-sm font-medium text-[#3d4f6f] mb-2">Modalidad de estudio</label>
          <div class="flex flex-wrap gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="modalidad"
                value="presencial"
                id="presencial"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Presencial</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="modalidad"
                value="virtual"
                id="virtual"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Virtual</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="radio"
                name="modalidad"
                value="mixto"
                id="mixto"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Mixto</span>
            </label>
          </div>
          <div id="mensaje_modalidad" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
        </div>

        <!-- Areas de interes -->
        <div>
          <label class="block text-sm font-medium text-[#3d4f6f] mb-2">Areas de interes</label>
          <div class="flex flex-wrap gap-4">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                name="interes"
                value="frontend"
                id="frontend"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] rounded focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Frontend</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                name="interes"
                value="backend"
                id="backend"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] rounded focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Backend</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                name="interes"
                value="robotica"
                id="robotica"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] rounded focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Robotica</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                name="interes"
                value="inteligencia_artificial"
                id="inteligencia_artificial"
                class="w-4 h-4 text-[#7ba7d7] border-[#c5d3e8] rounded focus:ring-[#7ba7d7]"
              />
              <span class="text-[#3d4f6f]">Inteligencia Artificial</span>
            </label>
          </div>
          <div id="mensaje_interes" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
        </div>
      </div>

      <!-- Seccion: Seguridad -->
      <div class="mb-6">
        <h2 class="text-sm font-semibold text-[#7ba7d7] uppercase tracking-wide mb-4">
          Seguridad
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Contrasena -->
          <div>
            <label for="pass" class="block text-sm font-medium text-[#3d4f6f] mb-1">Contrasena</label>
            <input
              type="password"
              placeholder="Contrasena"
              id="pass"
              name="pass"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_pass" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>

          <!-- Confirmar contrasena -->
          <div>
            <label for="pass2" class="block text-sm font-medium text-[#3d4f6f] mb-1">Confirmar contrasena</label>
            <input
              type="password"
              placeholder="Contrasena"
              id="pass2"
              name="pass2"
              class="w-full px-4 py-2 border border-[#c5d3e8] rounded-lg bg-[#f0f4fa] focus:border-[#7ba7d7] focus:ring-2 focus:ring-[#dce8f5] transition-colors duration-200 outline-none"
            />
            <div id="mensaje_pass2" class="text-[#d46a6a] text-sm mt-1 hidden"></div>
          </div>
        </div>
      </div>

      <!-- Terminos y condiciones -->
      <div class="mb-6">
        <label class="flex items-start gap-2 cursor-pointer">
          <input
            type="checkbox"
            name="terminos"
            id="terminos"
            class="w-4 h-4 mt-0.5 text-[#7ba7d7] border-[#c5d3e8] rounded focus:ring-[#7ba7d7]"
          />
          <span class="text-[#3d4f6f]">Acepto los terminos y condiciones</span>
        </label>
        <div id="mensaje_terminos" class="text-[#d46a6a] text-sm mt-1 ml-6 hidden"></div>
      </div>

      <!-- Mensaje de error general -->
      <div class="mb-4">
        <div id="error_mensajes" class="text-[#d46a6a] text-sm text-center font-medium hidden"></div>
      </div>

      <!-- Boton de envio -->
      <div class="mb-4">
        <button
          type="submit"
          class="w-full bg-[#7ba7d7] hover:bg-[#6a96c6] text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg cursor-pointer"
        >
          Enviar
        </button>
      </div>

      <!-- Mensaje de exito -->
      <div>
        <p
          id="mensaje_exito_form"
          class="text-[#5a9e6f] text-center font-medium hidden"
        >
          Formulario enviado correctamente.
        </p>
      </div>
    </form>

    <script src="./validacion_form.js"></script>
  </body>
</html>
