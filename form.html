<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP estricta: el CSS es un archivo local precompilado (tailwind.css)
      y los scripts son locales, por eso no se necesita 'unsafe-inline'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Formulario de Registro</title>
    <!-- Tailwind precompilado en build (npm run build:css); sin CDN en runtime -->
    <link rel="stylesheet" href="./tailwind.css" />
    <link rel="stylesheet" href="./estilos-puntuales.css" />
  </head>
  <body class="app-shell">
    <!-- novalidate: toda la validacion se maneja en JavaScript para
         mostrar mensajes propios en lugar de los tooltips del navegador. -->
    <form
      action=""
      id="formulario"
      novalidate
      class="form-panel"
    >
      <!-- Titulo -->
      <div class="form-header">
        <h1 class="form-title">
          Formulario de Registro
        </h1>
        <p class="form-subtitle">
          Completa todos los campos para registrarte e ingresar a nuestra academia
        </p>
      </div>

      <!-- Seccion: Datos Personales -->
      <div class="mb-6">
        <h2 class="section-title">
          Datos Personales
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Nombre -->
          <div>
            <label for="nombre" class="field-label">Nombre</label>
            <input
              type="text"
              placeholder="Nombre"
              id="nombre"
              name="nombre"
              maxlength="20"
              autocomplete="given-name"
              aria-describedby="mensaje_nombre"
              class="field-control"
            />
            <div id="mensaje_nombre" class="field-message hidden"></div>
          </div>

          <!-- Apellido -->
          <div>
            <label for="apellido" class="field-label">Apellido</label>
            <input
              type="text"
              placeholder="Apellido"
              id="apellido"
              name="apellido"
              maxlength="20"
              autocomplete="family-name"
              aria-describedby="mensaje_apellido"
              class="field-control"
            />
            <div id="mensaje_apellido" class="field-message hidden"></div>
          </div>
        </div>

        <!-- Cedula -->
        <div class="mt-4">
          <label for="cedula" class="field-label">Cedula de identidad</label>
          <input
            type="text"
            placeholder="V-2804716, E-32648512 o solo digitos"
            id="cedula"
            name="cedula"
            maxlength="11"
            autocomplete="off"
            aria-describedby="mensaje_cedula"
            class="field-control"
          />
          <div id="mensaje_cedula" class="field-message hidden"></div>
        </div>

        <!-- Fecha de nacimiento -->
        <div class="mt-4">
          <label for="nacimiento" class="field-label">Fecha de nacimiento</label>
          <input
            type="date"
            id="nacimiento"
            name="nacimiento"
            autocomplete="bday"
            aria-describedby="mensaje_nacimiento"
            class="field-control"
          />
          <div id="mensaje_nacimiento" class="field-message hidden"></div>
        </div>
      </div>

      <!-- Seccion: Contacto -->
      <div class="mb-6">
        <h2 class="section-title">
          Contacto
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Correo -->
          <div>
            <label for="correo" class="field-label">Correo</label>
            <input
              type="email"
              placeholder="correo@ejemplo.com"
              id="correo"
              name="correo"
              maxlength="100"
              autocomplete="email"
              aria-describedby="mensaje_correo"
              class="field-control"
            />
            <div id="mensaje_correo" class="field-message hidden"></div>
          </div>

          <!-- Telefono -->
          <div>
            <label for="telefono" class="field-label">Telefono</label>
            <input
              type="tel"
              placeholder="+584141234567"
              id="telefono"
              name="telefono"
              maxlength="13"
              autocomplete="tel"
              inputmode="tel"
              aria-describedby="mensaje_telefono"
              class="field-control"
            />
            <div id="mensaje_telefono" class="field-message hidden"></div>
          </div>
        </div>
      </div>

      <!-- Seccion: Ubicacion -->
      <div class="mb-6">
        <h2 class="section-title">
          Ubicacion
        </h2>

        <!-- Direccion -->
        <div class="mb-4">
          <label for="direccion" class="field-label">Direccion de habitacion</label>
          <input
            type="text"
            placeholder="Direccion"
            id="direccion"
            name="direccion"
            maxlength="150"
            autocomplete="street-address"
            aria-describedby="mensaje_direccion"
            class="field-control"
          />
          <div id="mensaje_direccion" class="field-message hidden"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Ciudad -->
          <div>
            <label for="ciudad" class="field-label">Ciudad</label>
            <input
              type="text"
              placeholder="Ciudad"
              id="ciudad"
              name="ciudad"
              maxlength="20"
              autocomplete="address-level2"
              aria-describedby="mensaje_ciudad"
              class="field-control"
            />
            <div id="mensaje_ciudad" class="field-message hidden"></div>
          </div>

          <!-- Pais -->
          <div>
            <label for="pais" class="field-label">Pais</label>
            <select
              name="pais"
              id="pais"
              autocomplete="country-name"
              aria-describedby="mensaje_pais"
              class="field-control"
            >
              <option value="">Seleccione un pais</option>
              <option value="venezuela">Venezuela</option>
              <option value="colombia">Colombia</option>
              <option value="peru">Peru</option>
              <option value="chile">Chile</option>
              <option value="argentina">Argentina</option>
              <option value="brasil">Brasil</option>
              <option value="mexico">Mexico</option>
              <option value="ecuador">Ecuador</option>
              <option value="espana">Espana</option>
            </select>
            <div id="mensaje_pais" class="field-message hidden"></div>
          </div>
        </div>
      </div>

      <!-- Seccion: Preferencias -->
      <div class="mb-6">
        <h2 class="section-title">
          Preferencias
        </h2>

        <!-- Genero (fieldset/legend para accesibilidad de grupos) -->
        <fieldset id="grupo_genero" class="mb-4" aria-describedby="mensaje_genero">
          <legend class="group-legend">Genero</legend>
          <div class="choice-list">
            <label class="choice-chip">
              <input
                type="radio"
                name="genero"
                value="masculino"
                id="masculino"
                class="choice-input"
              />
              <span class="choice-text">Masculino</span>
            </label>
            <label class="choice-chip">
              <input
                type="radio"
                name="genero"
                value="femenino"
                id="femenino"
                class="choice-input"
              />
              <span class="choice-text">Femenino</span>
            </label>
            <label class="choice-chip">
              <input
                type="radio"
                name="genero"
                value="no_decir"
                id="no_decir"
                class="choice-input"
              />
              <span class="choice-text">Prefiero no decir</span>
            </label>
          </div>
          <div id="mensaje_genero" class="field-message hidden"></div>
        </fieldset>

        <!-- Modalidad de estudio -->
        <fieldset id="grupo_modalidad" class="mb-4" aria-describedby="mensaje_modalidad">
          <legend class="group-legend">Modalidad de estudio</legend>
          <div class="choice-list">
            <label class="choice-chip">
              <input
                type="radio"
                name="modalidad"
                value="online"
                id="online"
                class="choice-input"
              />
              <span class="choice-text">Online</span>
            </label>
            <label class="choice-chip">
              <input
                type="radio"
                name="modalidad"
                value="presencial"
                id="presencial"
                class="choice-input"
              />
              <span class="choice-text">Presencial</span>
            </label>
            <label class="choice-chip">
              <input
                type="radio"
                name="modalidad"
                value="hibrida"
                id="hibrida"
                class="choice-input"
              />
              <span class="choice-text">Hibrida</span>
            </label>
          </div>
          <div id="mensaje_modalidad" class="field-message hidden"></div>
        </fieldset>

        <!-- Areas de interes (minimo 1, maximo 3) -->
        <fieldset id="grupo_interes" aria-describedby="mensaje_interes">
          <legend class="group-legend">Areas de interes (minimo 1, maximo 3)</legend>
          <div class="choice-list">
            <label class="choice-chip">
              <input
                type="checkbox"
                name="interes"
                value="frontend"
                id="frontend"
                class="choice-input"
              />
              <span class="choice-text">Frontend</span>
            </label>
            <label class="choice-chip">
              <input
                type="checkbox"
                name="interes"
                value="backend"
                id="backend"
                class="choice-input"
              />
              <span class="choice-text">Backend</span>
            </label>
            <label class="choice-chip">
              <input
                type="checkbox"
                name="interes"
                value="diseno_uiux"
                id="diseno_uiux"
                class="choice-input"
              />
              <span class="choice-text">Diseno UI-UX</span>
            </label>
            <label class="choice-chip">
              <input
                type="checkbox"
                name="interes"
                value="inteligencia_artificial"
                id="inteligencia_artificial"
                class="choice-input"
              />
              <span class="choice-text">Inteligencia Artificial</span>
            </label>
            <label class="choice-chip">
              <input
                type="checkbox"
                name="interes"
                value="bases_datos"
                id="bases_datos"
                class="choice-input"
              />
              <span class="choice-text">Bases de datos</span>
            </label>
          </div>
          <div id="mensaje_interes" class="field-message hidden"></div>
        </fieldset>
      </div>

      <!-- Seccion: Seguridad -->
      <div class="mb-6">
        <h2 class="section-title">
          Seguridad
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Contrasena + indicador de fortaleza -->
          <div>
            <label for="pass" class="field-label">Contrasena</label>
            <input
              type="password"
              placeholder="Contrasena"
              id="pass"
              name="pass"
              maxlength="50"
              autocomplete="new-password"
              aria-describedby="mensaje_pass fortaleza_pass"
              class="field-control"
            />
            <div id="mensaje_pass" class="field-message hidden"></div>

            <!-- Indicador de fortaleza (punto extra del enunciado) -->
            <div id="fortaleza_pass" class="mt-2 hidden" role="status">
              <div class="strength-track">
                <div id="fortaleza_barra" class="fortaleza-barra"></div>
              </div>
              <p id="fortaleza_texto" class="strength-text"></p>
            </div>
          </div>

          <!-- Confirmar contrasena -->
          <div>
            <label for="pass2" class="field-label">Confirmar contrasena</label>
            <input
              type="password"
              placeholder="Contrasena"
              id="pass2"
              name="pass2"
              maxlength="50"
              autocomplete="new-password"
              aria-describedby="mensaje_pass2"
              class="field-control"
            />
            <div id="mensaje_pass2" class="field-message hidden"></div>
          </div>
        </div>
      </div>

      <!-- Terminos y condiciones -->
      <div class="mb-6">
        <label class="terms-label">
          <input
            type="checkbox"
            name="terminos"
            id="terminos"
            aria-describedby="mensaje_terminos"
            class="choice-input"
          />
          <span class="choice-text">Acepto los terminos y condiciones</span>
        </label>
        <div id="mensaje_terminos" class="field-message terms-message hidden"></div>
      </div>

      <!-- Boton de envio -->
      <div class="mb-4">
        <button
          type="submit"
          class="btn-submit"
        >
          Enviar
        </button>
      </div>

      <!-- Mensaje de exito -->
      <div>
        <p
          id="mensaje_exito_form"
          role="status"
          class="form-success hidden"
        >
          ✅ Envío exitoso
        </p>
      </div>
    </form>

    <!-- Orden de carga: logica pura -> presentacion -> orquestacion -->
    <script src="./validators.js" defer></script>
    <script src="./form_ui.js" defer></script>
    <script src="./validacion_form.js" defer></script>
  </body>
</html>
